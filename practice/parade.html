
<!DOCTYPE html>
<html lang="en">
	<head>
		<title>Animation</title>
	</head>
	<body>
		<canvas id="myCanvas"
			width=800
			height=800>
		</canvas>
		<script>
			const canvas = document
			.getElementById("myCanvas");
			const ctx =canvas.getContext("2d")
			let time = 0;
			let x = 0;
			let y = 30;
			ctx.fiillStyle = "red";
			function animate(){
			time = time + 1;
			
				if(time > 100){
				y = y + 1;
				ctx.clearRect (0,0,800,800);
				ctx.fillstyle = "green";
				ctx.fillRect(y,600,50,50);
					ctx.fill();
			
				}
				if(time > 60){
				x = x + 5;
				ctx.clearRect (0,0,800,800);
				ctx.fillStyle = "red";
				ctx.fillRect(x,300,50,50);
					ctx.fill();
			
				}

				requestAnimationFrame(animate);
			}


			animate();


		</script>
	</body>
	</html>
